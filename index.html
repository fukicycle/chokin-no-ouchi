<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- iPhone のホーム画面から開いたときの見え方を決める meta は、問題の出ていない
         おまちかね・v2.0.0 と同じ形にそろえる。足したり JS で書き換えたりしない。
         mobile-web-app-capable を足す・black-translucent にする・theme-color を JS で書き換える、の
         どれかを入れた v2.1.0〜2.2.2 では、画面の下端に黒い帯が出た（design の DESIGN.md「注意」） -->
    <meta name="theme-color" content="#fcf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="貯金のおうち" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>アプリ</title>
    <script>
      // 保存したテーマを最初の描画の前に当てる（ちらつき防止）
      try {
        var t = JSON.parse(localStorage.getItem("%BASE_URL%::theme") || '"auto"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
