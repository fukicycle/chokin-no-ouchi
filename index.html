<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chokin-no-ouchi/icon.svg" />
    <link rel="apple-touch-icon" href="/chokin-no-ouchi/icon.svg" />
    <link rel="manifest" href="/chokin-no-ouchi/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA iOS & Android Theme Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ステータスバーの下までWebViewを敷いて上端の白帯を消す(viewport-fit=cover と併用)。
         WebViewがステータスバー下から始まる端末では、OSがその帯を theme-color で塗る。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- ヘッダー(.app-header)と同じ色。OSの配色ではなくアプリ内のテーマ切替に
         追従させるため、src/utils/chromeColor.js が実行時に書き換える。 -->
    <meta name="theme-color" content="#f2fafd" />
    
    <title>貯金のおうち - 家族共有家計簿</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
