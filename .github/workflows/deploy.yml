name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # Vite 7 は Node.js 20.19+ / 22.12+ が必要 (それ未満だと
          # index.html のインライン<script>/<style>のハッシュ計算で使う
          # crypto.hash が無く、ビルドが失敗する)。
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build with environment variables
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
